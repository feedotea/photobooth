<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FEEDO MUSEUM — PHOTO BOOTH</title>
<style>
  :root{--ink:#111;--paper:#f4f1ea;--grey:#8a857c;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Times New Roman",Georgia,serif;-webkit-user-select:none;user-select:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .masthead{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:3px double var(--ink);font-family:"Courier New",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  .masthead .title{font-family:"Times New Roman",serif;font-weight:700;letter-spacing:.26em;font-size:14px;}
  .screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;}
  .screen.active{display:flex;}
  /* start */
  .moby-mark{width:92px;height:92px;border-radius:50%;border:2px solid var(--ink);margin-bottom:26px;
    background:radial-gradient(circle at 30% 35%,var(--ink) 7px,transparent 8px),
      radial-gradient(circle at 68% 28%,var(--ink) 5px,transparent 6px),
      radial-gradient(circle at 55% 62%,var(--ink) 8px,transparent 9px),
      radial-gradient(circle at 30% 70%,var(--ink) 4px,transparent 5px);}
  #screen-start h1{font-size:clamp(38px,13vw,60px);font-weight:700;line-height:.95;text-transform:uppercase;letter-spacing:.02em;}
  #screen-start .sub{margin:16px 0 36px;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);line-height:1.9;}
  .btn{font-family:"Courier New",monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;padding:17px 40px;cursor:pointer;transition:transform .12s;width:100%;max-width:300px;}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn+.btn{margin-top:12px}
  /* capture */
  .vf-wrap{position:relative;width:100%;aspect-ratio:3/4;border:2px solid var(--ink);background:#000;overflow:hidden;}
  .vf-wrap video{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.12) brightness(1.04);}
  .vf-wrap video.mirror{transform:scaleX(-1);}
  .corner{position:absolute;width:20px;height:20px;border:2px solid #fff;opacity:.85}
  .corner.tl{top:8px;left:8px;border-right:none;border-bottom:none}
  .corner.tr{top:8px;right:8px;border-left:none;border-bottom:none}
  .corner.bl{bottom:8px;left:8px;border-right:none;border-top:none}
  .corner.br{bottom:8px;right:8px;border-left:none;border-top:none}
  .countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40vw;color:#fff;font-weight:700;text-shadow:0 0 30px rgba(0,0,0,.6);pointer-events:none;}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.fire{animation:flash .4s ease}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  @keyframes rareIn{0%{opacity:0;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
  .moby-overlay{position:absolute;right:4%;bottom:0;height:46%;z-index:4;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));opacity:.96;}
  .moby-overlay.moby-left{right:auto;left:4%;}
  .flip{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.6);font-family:"Courier New",monospace;font-size:10px;letter-spacing:.1em;padding:8px 12px;border-radius:20px;cursor:pointer;z-index:5;}
  .cap-status{margin-top:18px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);}
  .dots{margin-top:12px;display:flex;gap:9px}
  .dot{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:50%}
  .dot.done{background:var(--ink)}
  /* result */
  #screen-result{justify-content:flex-start;padding-top:24px;}
  .reward{border:2px solid var(--ink);padding:18px 16px;margin-bottom:20px;width:100%;}
  .reward .lead{font-size:26px;font-weight:700;letter-spacing:.02em;}
  .reward .desc{margin-top:10px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.08em;line-height:1.9;color:var(--ink);}
  .reward .stamp{margin-top:12px;font-family:"Courier New",monospace;font-size:10px;letter-spacing:.14em;color:var(--grey);text-transform:uppercase;}
  .outputs{display:flex;flex-direction:column;gap:18px;width:100%;align-items:center;margin-bottom:20px;}
  #strip{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.16);max-width:160px;height:auto;}
  /* developing animation */
  .dev-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);z-index:10;transition:opacity .8s ease;}
  .dev-overlay.fade-out{opacity:0;pointer-events:none;}
  .dev-text{font-family:"Courier New",monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);}
  .dev-dots::after{content:'';animation:devDots 1.5s steps(4,end) infinite;}
  @keyframes devDots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .dev-bar{width:140px;height:2px;background:rgba(0,0,0,.12);margin-top:18px;border-radius:1px;overflow:hidden;}
  .dev-bar-inner{width:0%;height:100%;background:var(--ink);transition:width 2.2s ease-in-out;}
  .dev-bar-inner.go{width:100%;}
  #stripImg{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.16);max-width:200px;height:auto;display:block;
    transition:opacity 1s ease, filter 1s ease;}
  #stripImg.developing{opacity:0;filter:blur(12px) brightness(1.3);}
  .save-hint{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.06em;color:var(--grey);line-height:1.8;margin-top:6px;}
  .actions{width:100%;max-width:300px;}
  .rare-badge{margin-top:10px;font-family:"Courier New",monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#a33;border:1.5px solid #a33;padding:6px 14px;display:none;}
  .rare-badge.show{display:inline-block;animation:rareIn .6s ease,rarePulse 2s ease-in-out infinite 1s;}
  @keyframes rarePulse{0%,100%{opacity:1}50%{opacity:.4}}
  .err{margin-top:20px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.08em;color:#a33;line-height:1.8;}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <span>TAINAN</span>
    <span class="title">FEEDO MUSEUM</span>
    <span>PHOTO BOOTH</span>
  </div>

  <!-- START -->
  <section class="screen active" id="screen-start">
    <div class="moby-mark"></div>
    <h1>The Photo<br>Archive</h1>
    <p class="sub">三格 · 黑白 · 一份紀念<br>留下,在經典之上</p>
    <button class="btn" id="startBtn">開始拍攝</button>
    <p class="err hidden" id="camErr"></p>
  </section>

  <!-- CAPTURE -->
  <section class="screen" id="screen-capture">
    <div class="vf-wrap">
      <video id="video" autoplay playsinline muted></video>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="flip" id="flipBtn">切換鏡頭</div>
      <img id="mobyOverlay0" class="moby-overlay moby-left" alt="Moby">
      <img id="mobyOverlay1" class="moby-overlay" alt="Moby" style="display:none">
      <img id="mobyOverlay2" class="moby-overlay" alt="Moby" style="display:none">
      <div class="countdown" id="countdown"></div>
      <div class="flash" id="flash"></div>
    </div>
    <p class="cap-status" id="capStatus">準備好,看鏡頭</p>
    <div class="dots" id="dots"></div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screen-result" style="position:relative;">
    <!-- 顯影動畫遮罩 -->
    <div class="dev-overlay" id="devOverlay">
      <div class="moby-mark" style="margin-bottom:22px;"></div>
      <div class="dev-text">沖洗中<span class="dev-dots"></span></div>
      <div class="dev-bar"><div class="dev-bar-inner" id="devBar"></div></div>
    </div>
    <div class="reward">
      <div class="lead">The Feedo Times</div>
      <div class="stamp" id="rewardStamp"></div>
    </div>
    <div class="outputs">
      <img id="stripImg" alt="拍貼條" class="developing">
    </div>
    <span class="rare-badge" id="rareBadge">★ rare print ★</span>
    <p class="rare-claim" id="rareClaim" style="display:none;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.08em;color:#a33;margin-top:10px;line-height:1.8;">憑此畫面至櫃台<br>領取 Moby 吊飾一只</p>
    <canvas id="strip" style="display:none"></canvas>
    <p class="save-hint">❶ 長按拍貼條 →「加入照片」存圖<br>❷ 中獎者再截圖整個畫面,保留兌換碼</p>
    <p style="font-family:Georgia,serif;font-size:11px;font-style:italic;letter-spacing:.04em;color:var(--ink);margin-top:14px;">Post your archive. Tag @feedomuseum.</p>
    <div class="actions">
      <button class="btn ghost" id="againBtn">再拍一次</button>
    </div>
  </section>
</div>

$('mobyOverlay0').src=MOBY_SRCS[0];
$('mobyOverlay1').src=MOBY_SRCS[1];
$('mobyOverlay2').src=MOBY_SRCS[2];

function show(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(s).classList.add('active');}

async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1440}},audio:false});
    video.srcObject=stream;
    video.classList.toggle('mirror', facing==='user');
    return true;
  }catch(e){
    $('camErr').textContent='無法開啟相機。請允許瀏覽器使用相機權限,並確認網址為 https。('+e.name+')';
    $('camErr').classList.remove('hidden');return false;
  }
}

$('startBtn').onclick=async()=>{
  const ok=await startCamera();if(!ok)return;
  captures=[];
  show('screen-capture');buildDots();runSequence();
};

$('flipBtn').onclick=async()=>{ facing=(facing==='user')?'environment':'user'; await startCamera(); };

function buildDots(){const d=$('dots');d.innerHTML='';for(let i=0;i<SHOTS;i++){const e=document.createElement('span');e.className='dot';e.id='dot'+i;d.appendChild(e);}}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

async function runSequence(){
  // 洗牌 Moby 姿勢順序,三格各不同
  const mobyOrder=[0,1,2];for(let j=2;j>0;j--){const k=Math.floor(Math.random()*(j+1));[mobyOrder[j],mobyOrder[k]]=[mobyOrder[k],mobyOrder[j]];}
  for(let i=0;i<SHOTS;i++){
    $('capStatus').textContent='第 '+(i+1)+' 格 / 共 '+SHOTS+' 格';
    // 三格固定三個不同 Moby 姿勢 (用洗牌順序)
    const mi=mobyOrder[i];
    for(let m=0;m<3;m++) $('mobyOverlay'+m).style.display=m===mi?'':'none';
    for(let n=COUNT_FROM;n>0;n--){$('countdown').textContent=n;await wait(1000);}
    $('countdown').textContent='';
    $('flash').classList.add('fire');capturePhoto();$('dot'+i).classList.add('done');
    await wait(420);$('flash').classList.remove('fire');await wait(450);
  }
  $('capStatus').textContent='沖洗中…';await wait(400);
  // 判定是否抽中限定版
  const isRare = Math.random() < RARE_CHANCE;
  // 限定版產生唯一兌換碼 (RM-XXXX)
  const rareCode = isRare ? 'RM-' + Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('') : '';
  buildStrip(isRare, rareCode, mobyOrder);
  // 追蹤拍照次數 (靜默送出,不影響體驗)
  if(TRACKER_URL) try{fetch(TRACKER_URL+'?t='+(isRare?'rare':'normal'));}catch(e){}
  const d=new Date();
  const stamp = 'NO. '+Math.floor(Math.random()*9000+1000)+' · '+d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
  $('rewardStamp').textContent= isRare ? '★ ' + stamp + ' ★' : stamp;
  // 顯影動畫: 先顯示結果畫面但拍貼隱藏, 遮罩蓋住
  $('stripImg').classList.add('developing');
  $('devOverlay').classList.remove('fade-out');
  $('devOverlay').style.display='flex';
  $('devBar').classList.remove('go');
  $('rareBadge').classList.remove('show');
  show('screen-result');
  // 啟動進度條動畫
  await wait(50);
  $('devBar').classList.add('go');
  // 等待顯影 (2.5 秒)
  await wait(2500);
  // 遮罩淡出
  $('devOverlay').classList.add('fade-out');
  await wait(300);
  // 拍貼從模糊變清晰 (像拍立得顯影)
  $('stripImg').classList.remove('developing');
  // 如果是限定版, 顯示印章 + 兌領說明 + 即時時鐘 + 驗證按鈕
  if(isRare){
    await wait(800);
    $('rareBadge').classList.add('show');
    $('rareClaim').style.display='block';
    const now=new Date();
    const inEvent=now>=EVENT_START && now<=EVENT_END;
    if(inEvent){
      $('rareClaim').innerHTML='兌換碼: <b style="font-size:16px;letter-spacing:.2em">'+rareCode+'</b><br>截圖此畫面 · 至櫃台出示<br>免費領取 Moby 吊飾一只<br><span style="font-size:9px;color:#8a857c">限時活動 6/19-6/21 · 每人限領一只</span><br><span style="font-size:9px;color:#a33">⚠ 請立即截圖保存,離開此頁面後無法找回<br>需出示截圖方可兌換,恕不接受口頭告知</span>';
    } else {
      $('rareClaim').innerHTML='<span style="font-size:10px;color:#8a857c">RARE PRINT · 恭喜抽到限定版</span>';
    }
  }
}

function capturePhoto(){
  const c=document.createElement('canvas');
  const w=video.videoWidth,h=video.videoHeight;
  c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  if(facing==='user'){ctx.translate(w,0);ctx.scale(-1,1);}
  ctx.drawImage(video,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h),p=img.data;
  for(let i=0;i<p.length;i+=4){let v=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];v=(v-128)*1.2+118;v=Math.max(0,Math.min(255,v));p[i]=p[i+1]=p[i+2]=v;}
  ctx.putImageData(img,0,0);
  captures.push(c);
}

// 直式四格拍貼條 (3:4 直幅格子)
function buildStrip(isRare, rareCode, mobyOrder){
  const strip=$('strip');
  const W=400,pad=18,gap=12,cellW=W-pad*2,cellH=Math.round(cellW*4/3);
  const headerH=92,footerH=104;
  const H=headerH+SHOTS*cellH+(SHOTS-1)*gap+footerH+pad;
  strip.width=W;strip.height=H;
  const ctx=strip.getContext('2d');
  // 限定版: 黑底白字反轉
  const bg=isRare?'#111':'#fff', ink=isRare?'#fff':'#111';
  const capColor=isRare?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.92)';
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle=ink;ctx.textAlign='center';
  // 報紙刊頭: THE FEEDO TIMES
  ctx.font='700 34px Georgia,"Times New Roman",serif';
  ctx.fillText('The Feedo Times',W/2,46);
  // 限定版特殊標記
  if(isRare){ctx.font='700 9px "Courier New",monospace';ctx.fillText('— RARE PRINT —',W/2,16);}
  // 刊頭下方雙細線 + 日期/地點
  const d=new Date();
  const dateStr=(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
  ctx.lineWidth=1;ctx.strokeStyle=ink;
  ctx.beginPath();ctx.moveTo(pad,58);ctx.lineTo(W-pad,58);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad,61);ctx.lineTo(W-pad,61);ctx.stroke();
  ctx.font='9px "Courier New",monospace';
  ctx.textAlign='left';ctx.fillText(dateStr,pad,74);
  ctx.textAlign='right';ctx.fillText('TAINAN',W-pad,74);
  ctx.textAlign='center';
  ctx.font='700 11px "Times New Roman",serif';
  ctx.fillText('— PHOTO ARCHIVE —',W/2,74);
  ctx.beginPath();ctx.moveTo(pad,82);ctx.lineTo(W-pad,82);ctx.stroke();
  // 洗牌 Moby 順序
  // 用拍攝時的 Moby 順序 (跟取景框一致)
  const stripMobyOrder=mobyOrder||[0,1,2];
  // 洗牌字幕 (三格不重複)
  const capPool=CAPTIONS.slice();for(let j=capPool.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[capPool[j],capPool[k]]=[capPool[k],capPool[j]];}
  let capIdx=0;
  let y=headerH;
  captures.forEach(c=>{
    // 置中裁切成 3:4
    const ar=c.width/c.height,tar=cellW/cellH;let sx,sy,sw,sh;
    if(ar>tar){sh=c.height;sw=c.height*tar;sx=(c.width-sw)/2;sy=0;}else{sw=c.width;sh=c.width/tar;sx=0;sy=(c.height-sh)/2;}
    ctx.drawImage(c,sx,sy,sw,sh,pad,y,cellW,cellH);
    // 三格各一個 Moby 姿勢
    const mIdx=stripMobyOrder[captures.indexOf(c)%3];
    const mi=mobyImgs[mIdx];
    const mobyLeft=MOBY_SIDE[mIdx]==='left';
    if(mi.complete && mi.naturalWidth){
      const mh=cellH*0.5, mw=mh*(mi.naturalWidth/mi.naturalHeight);
      const mx=mobyLeft?pad+4:pad+cellW-mw-4;
      ctx.drawImage(mi, mx, y+cellH-mh, mw, mh);
    }
    // 字幕放 Moby 對面 (洗牌不重複)
    const cap=capPool[capIdx++%capPool.length];
    ctx.font='italic 12px Georgia,serif';
    ctx.fillStyle=capColor;
    if(mobyLeft){ctx.textAlign='right';ctx.fillText(cap, pad+cellW-10, y+cellH-14);}
    else{ctx.textAlign='left';ctx.fillText(cap, pad+10, y+cellH-14);}
    ctx.fillStyle=ink;ctx.textAlign='center';
    ctx.lineWidth=1.5;ctx.strokeStyle=ink;ctx.strokeRect(pad,y,cellW,cellH);
    y+=cellH+gap;
  });
  // 刊尾: 細線 + 英文標語 + 新品快訊 + edition
  y+=4;
  ctx.lineWidth=1;ctx.strokeStyle=ink;
  ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();
  y+=20;
  ctx.font='italic 13px Georgia,serif';
  ctx.fillText('Love is not found. It is practiced.',W/2,y);
  y+=20;
  // 新品快訊 (上市期間放,之後可拿掉)
  ctx.font='700 10px "Courier New",monospace';
  ctx.fillText('— NOW SERVING —',W/2,y);
  y+=13;
  ctx.font='700 13px Georgia,serif';
  ctx.fillText('Our Tiramisu Assam',W/2,y);
  y+=20;
  ctx.font='9px "Courier New",monospace';
  ctx.fillText(isRare?'FEEDO MUSEUM · RARE EDITION':'FEEDO MUSEUM · TAINAN EDITION',W/2,y);
  y+=12;ctx.font='8px "Courier New",monospace';ctx.fillStyle=isRare?'rgba(255,255,255,.5)':'rgba(0,0,0,.35)';
  ctx.fillText('@feedomuseum',W/2,y);ctx.fillStyle=ink;
  // 限定版拍貼條上不印兌換碼 (防截圖冒領), 碼只顯示在手機畫面上
  stripUrl=strip.toDataURL('image/png');
  $('stripImg').src=stripUrl;
}

$('againBtn').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());$('camErr').classList.add('hidden');$('stripImg').classList.add('developing');$('rareBadge').classList.remove('show');$('rareClaim').style.display='none';$('devOverlay').style.display='none';show('screen-start');};

// 自動防快取: 每次載入都把頁面標記為最新,避免客人看到舊版
(function(){
  try{
    // 若是從 back-forward cache 還原,強制重新抓取最新頁面
    window.addEventListener('pageshow', function(e){
      if(e.persisted){ location.reload(); }
    });
  }catch(_){}
})();
</script>
