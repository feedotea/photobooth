<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FEEDO MUSEUM — PHOTO BOOTH</title>
<style>
  :root{--ink:#111;--paper:#f4f1ea;--grey:#8a857c;--line:rgba(17,17,17,.18);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Times New Roman",Georgia,serif;-webkit-user-select:none;user-select:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .masthead{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:3px double var(--ink);font-family:"Courier New",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  .masthead .title{font-family:"Times New Roman",serif;font-weight:700;letter-spacing:.26em;font-size:14px;}
  .screen{flex:1;display:none;flex-direction:column;align-items:center;padding:22px 22px 34px;text-align:center;}
  .screen.active{display:flex;}
  .mono{font-family:"Courier New",monospace;letter-spacing:.16em;text-transform:uppercase;}

  /* ===== 共用按鈕 ===== */
  .btn{font-family:"Courier New",monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;padding:17px 40px;cursor:pointer;transition:transform .12s;width:100%;max-width:300px;}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn+.btn{margin-top:14px}
  .err{margin-top:16px;font-family:"Courier New",monospace;font-size:11px;line-height:1.8;color:#a33;max-width:320px;}
  .hidden{display:none!important}

  /* ===== 首頁 ===== */
  #screen-landing{justify-content:center;gap:6px;}
  #boothImg{width:100%;max-width:330px;height:auto;cursor:pointer;transition:transform .18s;}
  #boothImg:active{transform:scale(.985)}
  .enter-btn{margin-top:38px;width:92px;height:auto;background:none;border:none;padding:0;cursor:pointer;transition:transform .12s;}
  .enter-btn img{width:100%;height:auto;display:block;}
  .enter-btn:active{transform:scale(.94)}
  .landing-sub{margin-top:16px;font-family:"Courier New",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);line-height:2;}

  /* ===== 返回列 ===== */
  .topbar{width:100%;display:flex;align-items:center;margin-bottom:14px;}
  .back{font-family:"Courier New",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:none;border:none;cursor:pointer;padding:4px 0;}

  /* ===== 模式切換 ===== */
  .seg{width:100%;max-width:330px;display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:22px;}
  .seg button{flex:1;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:12px 6px;border:none;background:transparent;color:var(--ink);cursor:pointer;transition:all .15s;}
  .seg button.active{background:var(--ink);color:var(--paper);}

  .sect-label{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--grey);margin-bottom:12px;}

  /* ===== 模板輪播 ===== */
  .carousel{width:100%;max-width:340px;display:flex;align-items:center;gap:8px;}
  .arrow{flex:0 0 34px;height:34px;padding:0;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);
    font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .arrow:active{background:var(--ink);color:var(--paper);}
  .tpl-card{flex:1;min-width:0;position:relative;background:#fff;border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(17,17,17,.13);padding:16px 12px;}
  .tpl-badge{position:absolute;top:0;left:0;background:var(--ink);color:var(--paper);font-family:"Courier New",monospace;font-size:9px;letter-spacing:.14em;padding:4px 8px;}
  .tpl-stage{height:300px;display:flex;align-items:center;justify-content:center;}
  #tplPreview{max-width:100%;max-height:100%;height:auto;width:auto;transition:opacity .16s ease,transform .16s ease;}
  #tplPreview.swap{opacity:0;transform:scale(.96);}
  .tpl-name{margin-top:14px;font-family:Georgia,serif;font-size:16px;letter-spacing:.04em;}
  .dots-nav{margin-top:10px;display:flex;gap:9px;justify-content:center;}
  .dots-nav span{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);cursor:pointer;transition:background .15s;}
  .dots-nav span.on{background:var(--ink)}

  /* ===== 濾鏡 ===== */
  .pick-row{width:100%;max-width:330px;display:flex;align-items:center;gap:10px;margin:24px 0 4px;}
  .pick-label{font-family:"Courier New",monospace;font-size:9px;letter-spacing:.15em;color:var(--grey);min-width:44px;text-align:left;}
  .pick-opts{display:flex;gap:6px;flex:1;}
  .pick-btn{flex:1;font-family:"Courier New",monospace;font-size:10px;letter-spacing:.12em;padding:9px 4px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:all .15s;}
  .pick-btn.active{background:var(--ink);color:var(--paper);}

  /* ===== 拍攝 ===== */
  #screen-capture{justify-content:center;}
  .vf-wrap{position:relative;width:100%;max-width:330px;border:2px solid var(--ink);background:#000;overflow:hidden;}
  .vf-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .vf-wrap video.mirror{transform:scaleX(-1);}
  .corner{position:absolute;width:20px;height:20px;border:2px solid #fff;opacity:.85}
  .corner.tl{top:8px;left:8px;border-right:none;border-bottom:none}
  .corner.tr{top:8px;right:8px;border-left:none;border-bottom:none}
  .corner.bl{bottom:8px;left:8px;border-right:none;border-top:none}
  .corner.br{bottom:8px;right:8px;border-left:none;border-top:none}
  .countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32vw;color:#fff;font-weight:700;text-shadow:0 0 30px rgba(0,0,0,.6);pointer-events:none;}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.fire{animation:flash .4s ease}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  .flip{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.6);font-family:"Courier New",monospace;font-size:10px;letter-spacing:.1em;padding:8px 12px;border-radius:20px;cursor:pointer;z-index:5;}
  .cap-status{margin-top:18px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);}
  .dots{margin-top:12px;display:flex;gap:9px}
  .dot{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:50%}
  .dot.done{background:var(--ink)}

  /* ===== 確認 ===== */
  #screen-check{justify-content:center;}
  #checkImg{max-width:210px;width:100%;height:auto;display:block;box-shadow:0 4px 20px rgba(0,0,0,.16);margin-bottom:24px;}
  #checkImg.wide,#outImg.wide{max-width:320px;}

  /* ===== 列印(成品從拍貼機吐出來) ===== */
  #screen-print{justify-content:center;}
  .print-title{font-family:"Courier New",monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);margin-bottom:6px;}
  /* 出紙口特寫。SLOT_* 幾個數值等插畫存進來後,由透明區實際量測填入 */
  /* 出紙口是 1:3.5 的直長圖,用高度控尺寸才不會在手機上爆版 */
  .dispenser{position:relative;margin:0 auto 18px;}
  .dispenser .chute{height:min(54vh,540px);width:auto;display:block;position:relative;z-index:1;pointer-events:none;}
  /* 遮罩開在開口以下,成品從開口冒出來、沿滑槽往下滑,開口以上會被切掉 */
  .chute-window{position:absolute;z-index:2;overflow:hidden;pointer-events:none;}
  .chute-window .print-out{position:absolute;left:50%;top:0;width:100%;height:auto;
    transform:translate(-50%,-102%);box-shadow:0 6px 16px rgba(0,0,0,.32);
    transition:transform 2.6s cubic-bezier(.22,.61,.36,1);}
  .chute-window .print-out.out{transform:translate(-50%,var(--rest,0px));}

  /* ===== 結果 ===== */
  #screen-result{position:relative;justify-content:flex-start;}
  .reward{border:2px solid var(--ink);padding:16px;margin-bottom:18px;width:100%;max-width:330px;}
  .reward .lead{font-size:24px;font-weight:700;letter-spacing:.02em;}
  .reward .stamp{margin-top:10px;font-family:"Courier New",monospace;font-size:10px;letter-spacing:.14em;color:var(--grey);text-transform:uppercase;}
  #outImg{max-width:230px;width:100%;height:auto;display:block;box-shadow:0 4px 20px rgba(0,0,0,.16);}
  .dev-dots::after{content:'';animation:devDots 1.5s steps(4,end) infinite;}
  @keyframes devDots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .save-hint{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.06em;color:var(--grey);line-height:1.8;margin-top:14px;}
  .save-hint.nudge{font-size:12px;color:var(--ink);background:#fff3c4;border:1.5px solid var(--ink);padding:10px 12px;max-width:320px;}
  .tag-line{font-family:Georgia,serif;font-size:13px;font-style:italic;letter-spacing:.04em;margin-top:12px;line-height:1.7;}
  .actions{width:100%;max-width:330px;margin-top:18px;}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <span>TAINAN</span>
    <span class="title">FEEDO MUSEUM</span>
    <span>PHOTO BOOTH</span>
  </div>

  <!-- ===== 1. 首頁 ===== -->
  <section class="screen active" id="screen-landing">
    <img id="boothImg" src="images/booth.webp" alt="FEEDO 拍貼機">
    <button class="enter-btn" id="enterBtn" aria-label="Enter"><img src="images/enter.webp" alt="Enter"></button>
    <p class="landing-sub">Take your own photo<br>photos ready in 3 minutes</p>
  </section>

  <!-- ===== 2. 選模板 ===== -->
  <section class="screen" id="screen-pick">
    <div class="topbar"><button class="back" id="pickBack">← 回首頁</button></div>

    <div class="seg" id="modeSeg">
      <button class="active" data-mode="shoot">📷 拍照</button>
      <button data-mode="upload">🖼 上傳照片</button>
    </div>

    <p class="sect-label">Choose Template</p>
    <div class="carousel">
      <button class="arrow" id="prevTpl" aria-label="上一個">‹</button>
      <div class="tpl-card">
        <span class="tpl-badge" id="tplBadge"></span>
        <div class="tpl-stage"><canvas id="tplPreview"></canvas></div>
      </div>
      <button class="arrow" id="nextTpl" aria-label="下一個">›</button>
    </div>
    <p class="tpl-name" id="tplName"></p>
    <div class="dots-nav" id="tplDots"></div>

    <div class="pick-row">
      <span class="pick-label">濾鏡</span>
      <div class="pick-opts">
        <button class="pick-btn active" data-filter="color">原色</button>
        <button class="pick-btn" data-filter="bw">黑白</button>
      </div>
    </div>

    <button class="btn" id="goBtn" style="margin-top:26px;">Next</button>
    <input type="file" id="albumInput" accept="image/*" multiple class="hidden">
    <p class="err hidden" id="pickErr"></p>
  </section>

  <!-- ===== 3. 拍攝 ===== -->
  <section class="screen" id="screen-capture">
    <div class="vf-wrap" id="vfWrap">
      <video id="video" autoplay playsinline muted></video>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="flip" id="flipBtn">切換鏡頭</div>
      <div class="countdown" id="countdown"></div>
      <div class="flash" id="flash"></div>
    </div>
    <p class="cap-status" id="capStatus">準備好,看鏡頭</p>
    <div class="dots" id="dots"></div>
  </section>

  <!-- ===== 4. 確認 ===== -->
  <section class="screen" id="screen-check">
    <p class="sect-label">Check your photo</p>
    <img id="checkImg" alt="成品預覽">
    <div class="actions" style="margin-top:0;">
      <button class="btn" id="printBtn">沖洗這張</button>
      <button class="btn ghost" id="retakeBtn">重拍</button>
    </div>
  </section>

  <!-- ===== 5. 列印 ===== -->
  <section class="screen" id="screen-print">
    <p class="print-title" id="printStatus">列印中<span class="dev-dots"></span></p>
    <div class="dispenser">
      <img class="chute" id="chuteImg" src="images/chute.webp" alt="出紙口">
      <div class="chute-window" id="chuteWindow"><img class="print-out" id="printOut" alt=""></div>
    </div>
    <button class="btn" id="pickupBtn" disabled>取件</button>
  </section>

  <!-- ===== 6. 成品 ===== -->
  <section class="screen" id="screen-result">
    <div class="reward">
      <div class="lead">The Feedo Times</div>
      <div class="stamp" id="rewardStamp"></div>
    </div>
    <img id="outImg" alt="拍貼成品">
    <canvas id="out" class="hidden"></canvas>
    <p class="save-hint" id="saveHint">⬇ 長按照片 →「加入照片」存圖</p>
    <p class="tag-line">Save your print.<br>Post it. Tag <b>@feedomuseum</b>.</p>
    <div class="actions">
      <button class="btn" id="dlBtn">儲存照片</button>
      <button class="btn" id="toRoomBtn">存進我的房間</button>
      <button class="btn ghost" id="againBtn">再拍一次</button>
    </div>
  </section>
</div>

<script>
// ===== 追蹤網址 =====
const TRACKER_URL = 'https://script.google.com/macros/s/AKfycbwmBQzkBw4s15BDI_6t3EBdyq6PYzwRGHWJdZAoIVy2ci3hCusI9fnyB2PFWPBNp5Sigg/exec';

// ===== 模板設定 =====
// slots 是模板圖原尺寸下的照片框 [x, y, w, h]。
// 插畫的照片框是有上色的,匯出時用顏色 + 黑色輪廓線偵測出來再挖成透明,座標從挖好的洞量測。
// frame:送到房間的圖框名稱(不填就用 id)。房間的 GEAR_RULES 認 'id'(吊繩)和 'moby'(領結)。
const TEMPLATES = [
  {id:'moby', name:"Moby's Show", src:'images/moby.webp', w:587, h:1495,
    slots:[[141,541,233,190],[139,802,233,189],[141,1058,232,187]]},
  {id:'milk', name:"Moby's Fresh Milk", src:'images/milk.webp', w:583, h:1482,
    slots:[[176,756,150,189],[341,756,155,189]]},
  {id:'polaroid', name:'拍立得 3 連張', src:'images/polaroid.webp', w:587, h:1492,
    slots:[[177,522,260,270],[161,827,268,281],[169,1143,268,276]]},
  {id:'cream', name:'鮮奶油專賣店', src:'images/cream.webp', w:587, h:1494,
    slots:[[217,229,187,252],[225,904,177,239]]},
  {id:'idblue', frame:'id', name:'證件照 · 藍', src:'images/idblue.webp', w:1413, h:880,
    slots:[[116,154,509,540]]},
  {id:'idpink', frame:'id', name:'證件照 · 粉', src:'images/idpink.webp', w:1414, h:881,
    slots:[[117,154,509,540]]}
];
// 模板圖的檔名會沿用,但換圖時尺寸和照片框位置都會變。如果瀏覽器或 CDN 還拿著舊圖,
// 新座標套在舊圖上就會錯位(照片被插畫蓋住,只露出一條邊)。換模板圖時一定要改這個版本號。
const ASSET_V = '20260914c';   // c:證件照照片框清掉紙紋碎點,說明小字移到照片下方
TEMPLATES.forEach(t => { t.src += '?v=' + ASSET_V; });
const COUNT_FROM = 3;
// 成品底色:插畫是去背的,這個顏色會出現在輪廓外的凹角。
// 深墨比紙色好的原因:限動的底本來就是黑的,接上去等於滿版;
// 貼文在 IG 淺色模式下也才有清楚的邊界,不會跟白色動態牆糊在一起。
const PRINT_BG = '#221e1c';
// 出紙口插畫上,滑槽開口的位置(佔整張圖的比例)。
// 圖換掉時只要改這四個數字,動畫就會跟著對齊。
// 量測值來自 chute.webp(424×1500):滑槽內壁 x=87..342,出紙開口(灰色橫桿)y=713,槽底 y=1415
const CHUTE = { left:87/424, width:255/424, top:713/1500, bottom:1415/1500 };

let tplIndex = 0, mode = 'shoot', selectedFilter = 'color';
let stream = null, captures = [], outUrl = null, outBlob = null, facing = 'user';

const $ = id => document.getElementById(id);
const video = $('video');
const wait = ms => new Promise(r => setTimeout(r, ms));
const tpl = () => TEMPLATES[tplIndex];
const shotsNeeded = () => tpl().slots.length;

// 預先載入模板圖
const tplImgs = {};
TEMPLATES.forEach(t => { const im = new Image(); im.src = t.src; tplImgs[t.id] = im; });

function show(s){
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  $(s).classList.add('active');
  window.scrollTo(0,0);
}

// ===== 濾鏡 =====
// 原色:微調對比 + 飽和;黑白:高對比灰階
const PREVIEW_FILTER = {
  color:'contrast(1.05) brightness(1.02) saturate(1.08)',
  bw:'grayscale(1) contrast(1.12) brightness(1.04)'
};
function applyFilter(ctx, w, h){
  const img = ctx.getImageData(0,0,w,h), p = img.data;
  for(let i=0;i<p.length;i+=4){
    const r=p[i], g=p[i+1], b=p[i+2];
    if(selectedFilter==='bw'){
      let v=0.299*r+0.587*g+0.114*b;
      v=Math.max(0,Math.min(255,(v-128)*1.2+118));
      p[i]=p[i+1]=p[i+2]=v;
    }else{
      p[i]  =Math.max(0,Math.min(255,(r-128)*1.05+130));
      p[i+1]=Math.max(0,Math.min(255,(g-128)*1.05+130));
      p[i+2]=Math.max(0,Math.min(255,(b-128)*1.05+130));
    }
  }
  ctx.putImageData(img,0,0);
}

// ===== 模板輪播 =====
function drawPreview(){
  const t = tpl(), im = tplImgs[t.id];
  // 同時限制寬和高:直式模板吃滿高度,橫式(證件照)吃滿寬度,都不會變形。
  // 畫面還沒顯示時 clientWidth 是 0,先用 260 頂著,enter() 會再畫一次
  const stageW = document.querySelector('.tpl-stage').clientWidth || 260;
  const cv = $('tplPreview'), scale = Math.min(300 / t.h, stageW / t.w);
  cv.width = Math.round(t.w*scale); cv.height = Math.round(t.h*scale);
  cv.style.width = cv.width+'px'; cv.style.height = cv.height+'px';
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  // 挖空處填淺灰 + 編號,讓人一眼看懂照片會放哪、拍的順序
  t.slots.forEach((s,i) => {
    const x=s[0]*scale, y=s[1]*scale, w=s[2]*scale, h=s[3]*scale;
    ctx.fillStyle = '#ddd8cd';
    ctx.fillRect(x,y,w,h);
    if(t.slots.length > 1){
      ctx.fillStyle = '#9a948a';
      ctx.font = '700 ' + Math.round(Math.min(w,h)*0.5) + 'px Georgia,serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(i+1), x+w/2, y+h/2);
    }
  });
  if(im.complete && im.naturalWidth){
    ctx.drawImage(im, 0, 0, cv.width, cv.height);
  }else{
    im.onload = drawPreview;
  }
  $('tplName').textContent = t.name;
  $('tplBadge').textContent = t.slots.length + ' 格';
  document.querySelectorAll('#tplDots span').forEach((d,i) => d.classList.toggle('on', i===tplIndex));
}
// 切換模板:淡出 → 換圖 → 淡入
let swapping = false;
function goTo(i){
  i = (i + TEMPLATES.length) % TEMPLATES.length;
  if(i === tplIndex || swapping) return;
  swapping = true;
  const cv = $('tplPreview');
  cv.classList.add('swap');
  setTimeout(() => {
    tplIndex = i; drawPreview();
    cv.classList.remove('swap');
    swapping = false;
  }, 160);
}
function buildTplDots(){
  const box = $('tplDots'); box.innerHTML='';
  TEMPLATES.forEach((t,i) => {
    const s = document.createElement('span');
    s.onclick = () => goTo(i);
    box.appendChild(s);
  });
}
$('prevTpl').onclick = () => goTo(tplIndex-1);
$('nextTpl').onclick = () => goTo(tplIndex+1);

// 模板區也支援左右滑動
(function(){
  const stage = document.querySelector('.carousel');
  let x0 = null;
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', e => {
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) < 40) return;
    goTo(tplIndex + (dx<0?1:-1));
  }, {passive:true});
})();

// ===== 模式 / 濾鏡切換 =====
document.querySelectorAll('#modeSeg button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#modeSeg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); mode = b.dataset.mode;
    $('goBtn').textContent = (mode==='upload') ? '選擇照片' : 'Next';
  };
});
document.querySelectorAll('.pick-btn[data-filter]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.pick-btn[data-filter]').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); selectedFilter = b.dataset.filter;
  };
});

// ===== 首頁 → 選模板 =====
function enter(){ show('screen-pick'); drawPreview(); }
$('enterBtn').onclick = enter;
$('boothImg').onclick = enter;
$('pickBack').onclick = () => { stopCamera(); show('screen-landing'); };

// ===== 相機 =====
async function startCamera(){
  try{
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1920}}, audio:false
    });
    video.srcObject = stream;
    video.classList.toggle('mirror', facing==='user');
    return true;
  }catch(e){
    $('pickErr').textContent = '無法開啟相機。請允許瀏覽器使用相機權限,並確認網址為 https。('+e.name+')';
    $('pickErr').classList.remove('hidden');
    return false;
  }
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
$('flipBtn').onclick = async () => { facing = (facing==='user') ? 'environment' : 'user'; await startCamera(); };

// ===== Next:拍照 or 上傳 =====
$('goBtn').onclick = async () => {
  $('pickErr').classList.add('hidden');
  if(mode==='upload'){ $('albumInput').click(); return; }
  const ok = await startCamera(); if(!ok) return;
  captures = [];
  // 取景框比例跟著模板格子走,所見即所得
  const s = tpl().slots[0];
  $('vfWrap').style.aspectRatio = s[2] + ' / ' + s[3];
  video.style.filter = PREVIEW_FILTER[selectedFilter];
  show('screen-capture');
  buildDots();
  runSequence();
};

function buildDots(){
  const n = shotsNeeded(), d = $('dots'); d.innerHTML='';
  for(let i=0;i<n;i++){
    const e = document.createElement('span');
    e.className = 'dot'; e.id = 'dot'+i;
    d.appendChild(e);
  }
}

function capturePhoto(){
  const c = document.createElement('canvas');
  const w = video.videoWidth, h = video.videoHeight;
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if(facing==='user'){ ctx.translate(w,0); ctx.scale(-1,1); }
  ctx.drawImage(video,0,0,w,h);
  ctx.setTransform(1,0,0,1,0,0);
  applyFilter(ctx,w,h);
  captures.push(c);
}

async function runSequence(){
  const n = shotsNeeded();
  for(let i=0;i<n;i++){
    $('capStatus').textContent = '第 '+(i+1)+' 格 / 共 '+n+' 格';
    for(let c=COUNT_FROM;c>0;c--){ $('countdown').textContent = c; await wait(1000); }
    $('countdown').textContent = '';
    $('flash').classList.add('fire');
    capturePhoto();
    $('dot'+i).classList.add('done');
    await wait(420); $('flash').classList.remove('fire'); await wait(450);
  }
  $('capStatus').textContent = '沖洗中…';
  stopCamera();
  await wait(300);
  finish();
}

// ===== 從相簿上傳 =====
$('albumInput').onchange = async e => {
  const need = shotsNeeded();
  const files = Array.from(e.target.files).slice(0, need);
  if(files.length < need){
    $('pickErr').textContent = '這個模板需要 '+need+' 張照片,請一次選 '+need+' 張。';
    $('pickErr').classList.remove('hidden');
    $('albumInput').value = '';
    return;
  }
  $('pickErr').classList.add('hidden');
  captures = [];
  for(const file of files){
    const img = await new Promise(res => {
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => res(im); im.src = r.result; };
      r.readAsDataURL(file);
    });
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img,0,0);
    applyFilter(ctx, c.width, c.height);
    captures.push(c);
  }
  $('albumInput').value = '';
  finish();
};

// ===== 合成 =====
// 照片先畫進挖空位置,再把插畫整張疊上去(挖空處是透明的,所以照片會從洞裡露出來)
function drawCover(ctx, src, x, y, w, h){
  const sw = src.width, sh = src.height;
  const scale = Math.max(w/sw, h/sh);
  const dw = sw*scale, dh = sh*scale;
  ctx.drawImage(src, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
}
function compose(){
  const t = tpl(), cv = $('out');
  cv.width = t.w; cv.height = t.h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = PRINT_BG;
  ctx.fillRect(0,0,t.w,t.h);
  t.slots.forEach((s,i) => {
    const src = captures[i]; if(!src) return;
    // 出血:照片往外多畫幾個 pixel,墊在插畫挖空處的柔邊底下,
    // 否則柔邊會透出底色,照片四周就會出現一圈淺色光暈
    const b = Math.max(3, Math.round(Math.min(s[2],s[3])*0.02));
    const x = s[0]-b, y = s[1]-b, w = s[2]+b*2, h = s[3]+b*2;
    ctx.save();
    ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    drawCover(ctx, src, x, y, w, h);
    ctx.restore();
  });
  const im = tplImgs[t.id];
  if(im.complete && im.naturalWidth) ctx.drawImage(im, 0, 0, t.w, t.h);
  outUrl = cv.toDataURL('image/png');
  $('outImg').src = outUrl;
  const wide = t.w > t.h;
  $('outImg').classList.toggle('wide', wide);
  $('checkImg').classList.toggle('wide', wide);
  // 下載/分享用 blob,不用 data URL:Chrome 的 data URL 有 2MB 上限,
  // 證件照合成手機照片後大約 2MB,超過就會「按了沒反應」。
  // toBlob 會在呼叫當下擷取畫面,之後重畫也不影響這一份
  outBlob = new Promise(res => cv.toBlob(res, 'image/png'));
  $('saveHint').classList.remove('nudge');
  $('saveHint').textContent = '⬇ 長按照片 →「加入照片」存圖';
}

function finish(){
  compose();
  if(TRACKER_URL) try{ fetch(TRACKER_URL+'?t='+tpl().id); }catch(e){}
  const d = new Date();
  $('rewardStamp').textContent = 'NO. ' + Math.floor(Math.random()*9000+1000) + ' · '
    + d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  $('checkImg').src = outUrl;
  show('screen-check');           // 先讓客人確認,不滿意可以重拍
}

// 重拍:沿用同一個模板與濾鏡,直接再跑一次
$('retakeBtn').onclick = async () => {
  captures = [];
  if(mode === 'upload'){ $('albumInput').click(); return; }
  const ok = await startCamera();
  if(!ok){ show('screen-pick'); return; }
  show('screen-capture'); buildDots(); runSequence();
};

// 沖洗:成品從拍貼機的出口滑出來
function layoutChute(){
  const img = $('chuteImg'), win = $('chuteWindow');
  if(!img.naturalWidth) return;
  const w = img.clientWidth, h = img.clientHeight;
  const winW = CHUTE.width*w, winH = (CHUTE.bottom-CHUTE.top)*h;
  win.style.left   = (CHUTE.left*w)+'px';
  win.style.width  = winW+'px';
  win.style.top    = (CHUTE.top*h)+'px';
  win.style.height = winH+'px';
  // 終點:讓成品底部落在槽底,不要停在半空中。
  // 用模板比例算高度,不依賴圖片載入完成
  const t = tpl();
  const printH = winW * (t.h / t.w);
  $('printOut').style.setProperty('--rest', Math.max(0, winH-printH)+'px');
}
$('chuteImg').addEventListener('load', layoutChute);
window.addEventListener('resize', layoutChute);

$('printBtn').onclick = async () => {
  const po = $('printOut');
  po.src = outUrl;
  po.classList.remove('out');
  $('printStatus').innerHTML = '列印中<span class="dev-dots"></span>';
  $('pickupBtn').disabled = true;
  show('screen-print');
  // 一定要等畫面顯示後才量尺寸:display:none 的元素 clientWidth 是 0,
  // 遮罩會變成零尺寸,成品就永遠看不見
  await wait(60);
  layoutChute();
  await wait(80);
  po.classList.add('out');
  await wait(2700);
  $('printStatus').textContent = '請取件';
  $('pickupBtn').disabled = false;
};

$('pickupBtn').onclick = () => {
  $('outImg').src = outUrl;
  show('screen-result');
};

$('againBtn').onclick = () => {
  stopCamera();
  captures = [];
  $('printOut').classList.remove('out');
  $('pickErr').classList.add('hidden');
  show('screen-pick');
  drawPreview();
};

// ===== 初始化 =====
buildTplDots();
drawPreview();

/* ===== 儲存照片 =====
   三種環境三種做法,不能只靠 <a download>:
   - iPhone / iPad:系統分享面板,裡面有「儲存影像」,會直接進相簿
     (iOS 的 <a download> 只會存到「檔案」App,客人找不到)
   - IG / LINE / FB 內建瀏覽器:下載和分享常被擋,改成明確教他長按或換瀏覽器
   - Android / 電腦:blob 網址直接下載 */
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS 會偽裝成 Mac
}
function isInAppBrowser(){ return /Instagram|FBAN|FBAV|Line\/|MicroMessenger/i.test(navigator.userAgent); }

function nudgeLongPress(){
  const h = $('saveHint');
  h.textContent = '這個瀏覽器不能直接下載:請長按上面的照片 →「加入照片」,或點右上角「⋯」改用 Safari / Chrome 開啟';
  h.classList.add('nudge');
  $('outImg').scrollIntoView({behavior:'smooth', block:'center'});
}

$('dlBtn').onclick = async () => {
  const blob = outBlob && await outBlob;
  if(!blob){ nudgeLongPress(); return; }
  const name = 'feedo-' + tpl().id + '.png';
  const file = new File([blob], name, {type:'image/png'});

  if(isIOS() && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e.name === 'AbortError') return; }   // 客人自己關掉分享面板,不用做任何事
  }
  if(isIOS() || isInAppBrowser()){ nudgeLongPress(); return; }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
};

/* ===== 存進我的房間 =====
   把第一張原始拍攝點陣化成 1-bit,用網址帶到 PET。
   原圖不離開這支手機 —— 送出去的只有黑白點陣。

   取 captures[0] 而不是合成後的成品:成品的版面隨模板改變
   (1~4 格、每個模板挖空位置都不同),要挖出照片得靠寫死的座標,
   猜錯就送出一塊插畫。原始畫面不需要知道版面。

   長按存圖那條路完全保留,這只是多一條。 */
// 本機開發時送到本機的房間(feedo-pet 的 serve.sh 開在 8123),正式站送正式的
const PET_URL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? 'http://localhost:8123/' : 'https://pet.feedomuseum.com/';
const ROOM_W=60, ROOM_H=80;

function roomDither(src,sx,sy,sw,sh,w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(src,sx,sy,sw,sh,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;
  const g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++) g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  const bits=new Uint8Array(Math.ceil(w*h/8));
  // Floyd-Steinberg:誤差往右與往下擴散,用點的疏密模擬灰階。
  // 報紙印照片就是這個原理,所以點陣化不是降級,是「被登在報上」。
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){
    const i=y*w+xx,old=g[i],nv=old<128?0:255,err=old-nv;
    g[i]=nv;
    if(nv===0) bits[i>>3]|=(0x80>>(i&7));
    if(xx+1<w)          g[i+1]     +=err*7/16;
    if(y+1<h&&xx>0)     g[i+w-1]   +=err*3/16;
    if(y+1<h)           g[i+w]     +=err*5/16;
    if(y+1<h&&xx+1<w)   g[i+w+1]   +=err*1/16;
  }
  return bits;
}

function roomB64(bytes){
  let s='';for(const b of bytes)s+=String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function saveToRoom(){
  const c=captures[0];
  if(!c){return;}
  // 相機是 4:3 或 16:9,房間要 3:4。置中裁切而不是壓扁 ——
  // 裁切只是少看到兩側,壓扁會讓人變形。(與 drawCover 同一套算法)
  const tar=ROOM_W/ROOM_H, ar=c.width/c.height;
  let sw,sh;
  if(ar>tar){sh=c.height;sw=c.height*tar;} else {sw=c.width;sh=c.width/tar;}
  const sx=(c.width-sw)/2, sy=(c.height-sh)/2;

  const bits=roomDither(c,sx,sy,sw,sh,ROOM_W,ROOM_H);
  const u=new URL(PET_URL);
  u.searchParams.set('photo',roomB64(bits));
  u.searchParams.set('w',ROOM_W);
  u.searchParams.set('h',ROOM_H);
  // 房間用這個值算「用某個圖框拍過」的解鎖條件(roomModel.js 的 GEAR_RULES),
  // 也會印在照片下方。改模板 id 的話那邊要一起改。
  u.searchParams.set('frame',tpl().frame || tpl().id);
  stopCamera();
  location.href=u.toString();
}
// 跟房間的 LINKS.boothReady 是一組,兩邊一起開(2026-09-12 遊戲定版上線後打開)。
// 2026-09-13 改版時先關掉:當時的模板 id 跟房間 GEAR_RULES 綁的名稱(id/moby)對不上。
// 2026-09-14 換模板後已對齊:證件照送 frame=id(吊繩)、Moby's Show 的 id 是 moby(領結),
// 房間那邊不用改。仍然關著是因為還沒決定重開 —— 打開前記得房間的 LINKS.boothReady 也要一起開。
const ROOM_LIVE=false;
$('toRoomBtn').onclick=saveToRoom;
if(!ROOM_LIVE && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) $('toRoomBtn').style.display='none';

// 自動防快取:從 back-forward cache 還原時強制重新抓最新頁面
window.addEventListener('pageshow', e => { if(e.persisted) location.reload(); });
</script>
